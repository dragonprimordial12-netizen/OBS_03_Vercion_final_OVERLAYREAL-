<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dragon Primordial — Overlay Gameplay (Real)</title>
<script>
/* Dentro de OBS = transparente. En un navegador normal se ve sobre fondo oscuro y se escala a la ventana.
   Forzar modo OBS con:  ?obs */
(function () {
  var enOBS = !!window.obsstudio || /[?&]obs\b/.test(location.search);
  document.documentElement.className = enOBS ? 'obs' : 'fuera';
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;background:transparent;}
html.obs,html.obs body{width:1920px;height:1080px;}
html.fuera,html.fuera body{background:#0d1117;}

.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;}
html.fuera .stage{background:linear-gradient(135deg,#0a1628 0%,#0d2137 50%,#0a1628 100%);}

/* ── EFECTOS: METEORITOS + FUEGO (canvas) ── */
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:6;pointer-events:none;}

/* ── DRAGÓN VOLADOR ── */
#dragon{
  position:absolute;left:0;top:0;z-index:7;
  width:380px;height:calc(380px * 296 / 440);
  display:none;pointer-events:none;
  filter:drop-shadow(0 0 16px rgba(255,60,0,.45));
  will-change:transform;
}
#dragon svg{width:100%;height:100%;display:block;}

/* ── BARRA SUPERIOR ── */
.top-bar{
  position:absolute;top:0;left:0;right:0;
  height:48px;
  background:linear-gradient(180deg,rgba(0,0,0,0.9) 0%,transparent 100%);
  display:flex;align-items:center;
  padding:0 24px;gap:12px;
  z-index:10;
}
.channel-name{
  font-size:18px;font-weight:900;
  color:#e84545;letter-spacing:3px;
  text-transform:uppercase;
  text-shadow:0 0 20px #cc0000;
}
.dot-sep{color:#444;font-size:14px;}
.game-tag{font-size:14px;color:#888;letter-spacing:2px;text-transform:uppercase;}
.live-badge{
  margin-left:auto;
  background:#e84545;color:#fff;
  font-size:12px;font-weight:900;
  padding:4px 12px;border-radius:3px;
  letter-spacing:2px;
  box-shadow:0 0 12px #cc000088;
  animation:livepulse 2s ease-in-out infinite;
}
@keyframes livepulse{
  0%,100%{box-shadow:0 0 8px #cc000088;}
  50%{box-shadow:0 0 20px #ff000099;}
}

/* ── ESQUINAS ── */
.corner{position:absolute;width:70px;height:70px;border-color:#cc0000;border-style:solid;opacity:0.7;z-index:9;}
.ctleft{top:20px;left:20px;border-width:2px 0 0 2px;border-radius:5px 0 0 0;}
.ctright{top:20px;right:20px;border-width:2px 2px 0 0;border-radius:0 5px 0 0;}
.cbleft{bottom:20px;left:20px;border-width:0 0 2px 2px;border-radius:0 0 0 5px;}
.cbright{bottom:20px;right:20px;border-width:0 2px 2px 0;border-radius:0 0 5px 0;}
.corner-tl,.corner-tr{position:absolute;top:0;width:40px;height:40px;border-top:2px solid #e84545;opacity:0.5;z-index:9;}
.corner-tl{left:0;border-left:2px solid #e84545;border-radius:8px 0 0 0;}
.corner-tr{right:0;border-right:2px solid #e84545;border-radius:0 8px 0 0;}

/* ── BARRA INFERIOR ── */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  height:5px;z-index:10;
  background:linear-gradient(90deg,transparent,#8b0000,#e84545,#ff0000,#e84545,#8b0000,transparent);
}

/* ── AVATAR BOX (esquina inf izquierda) ── */
.avatar-box{
  position:absolute;bottom:24px;left:24px;
  width:180px;
  background:rgba(0,0,0,0.82);
  border:1.5px solid #8b1a1a;
  border-radius:12px;
  padding:12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  z-index:10;
  box-shadow:0 0 20px rgba(139,0,0,0.4);
}
.avatar-placeholder{
  width:120px;height:120px;
  border-radius:8px;
  background:#100303;
  border:1px solid #5a0f0f;
  display:flex;align-items:center;justify-content:center;
  font-size:64px;line-height:1;
}
.avatar-name{
  font-size:11px;color:#e84545;
  font-weight:700;letter-spacing:2px;
  text-align:center;text-transform:uppercase;
}
.mic-bar{width:100%;height:4px;background:#1a0505;border-radius:2px;overflow:hidden;}
.mic-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#cc0000,#ff4444);
  border-radius:2px;transition:width 0.08s;
}

/* ── SOCIALES (esquina sup derecha) ── */
.socials{
  position:absolute;top:58px;right:24px;
  display:flex;flex-direction:column;gap:6px;
  z-index:10;
}
.social-pill{
  background:rgba(0,0,0,0.8);
  border:0.5px solid #3a1111;
  border-radius:20px;
  padding:5px 14px 5px 10px;
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:#aaa;
  letter-spacing:0.5px;
  backdrop-filter:blur(4px);
}
.social-icon{font-size:13px;}

/* ── ALERTA (centro superior) ── */
.alert{
  position:absolute;top:58px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.88);
  border:1px solid #e84545;
  border-radius:8px;

  display:flex;align-items:center;gap:8px;
  z-index:10;
  white-space:nowrap;
  box-shadow:0 0 16px rgba(232,69,69,0.3);
  animation:alertslide 0.4s ease both;
}
@keyframes alertslide{
  from{opacity:0;transform:translateX(-50%) translateY(-10px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}
}
.alert-icon{font-size:16px;}
.alert-text{font-size:13px;color:#fff;letter-spacing:0.5px;}
.alert-name{color:#e84545;font-weight:700;}

/* ── CHAT (esquina inf derecha) ── */

.chat-title{

.c1{color:#e84545;}

.c3{color:#e8c445;}
.c4{color:#45e88a;}
.chat-text{color:#ccc;}

<script>
/* ═══════════════════════════════════════════════
   ⚙️ CONFIGURACIÓN (cambiá estos números a gusto)
   ═══════════════════════════════════════════════ */
const CONFIG = {
  // Lluvia ligera constante: un meteorito cada X–Y milisegundos
  meteoroCadaMs: [1300, 3000],
  // Lluvia fuerte periódica
  lluviaFuerte: { primeraEnMs: 25000, cadaMs: 70000, duracionMs: 9000, porSegundo: 9 },
  // Dragón volador
  dragon: { primeroEnMs: 8000, cadaMs: 50000, duracionMs: 13000, tamano: 380 }
};

/* ═══════════════════════════════════════════════
   🌌 MOTOR DE EFECTOS
   ═══════════════════════════════════════════════ */
const cv = document.getElementById('fx');
const cx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);

const meteoros = [];
const brasas   = [];   // chispas de meteoritos
const llamas   = [];   // aliento del dragón

/* ── METEORITOS ── */
function crearMeteoro(grande) {
  const vel = grande ? rand(700, 950) : rand(1000, 1500);
  const ang = rand(0.42, 0.62);                 // inclinación (cae hacia la izquierda)
  const dx = -Math.sin(ang), dy = Math.cos(ang);
  const dur = grande ? rand(1.7, 2.3) : rand(0.9, 1.5);
  // nace arriba o por el borde derecho
  let x, y;
  if (Math.random() < 0.75) { x = rand(500, 2300); y = -80; }
  else                      { x = 2000;            y = rand(-40, 500); }
  meteoros.push({
    x, y, dx, dy, vel, dur, edad: 0, grande,
    largo:  grande ? rand(340, 480) : rand(140, 300),
    grosor: grande ? rand(9, 14)    : rand(2.2, 4.5)
  });
}

function emitirBrasa(x, y, dx, dy, grande) {
  brasas.push({
    x, y,
    vx: dx * rand(20, 80) + rand(-50, 50),
    vy: dy * rand(20, 80) + rand(-30, 60),
    vida: rand(0.4, 1.0), edad: 0,
    r: grande ? rand(1.5, 3.4) : rand(0.8, 2)
  });
}

function actualizarMeteoros(dt) {
  for (let i = meteoros.length - 1; i >= 0; i--) {
    const m = meteoros[i];
    m.edad += dt;
    m.x += m.dx * m.vel * dt;
    m.y += m.dy * m.vel * dt;
    if (Math.random() < (m.grande ? 0.9 : 0.4)) emitirBrasa(m.x, m.y, -m.dx, -m.dy, m.grande);
    if (m.edad >= m.dur) {
      if (m.grande) for (let k = 0; k < 14; k++) emitirBrasa(m.x, m.y, rand(-1, 1), rand(-1, 0.3), true);
      meteoros.splice(i, 1);
    }
  }
}

function dibujarMeteoros() {
  cx.globalCompositeOperation = 'lighter';
  for (const m of meteoros) {
    const p = m.edad / m.dur;
    const a = Math.min(1, p / 0.12) * Math.min(1, (1 - p) / 0.3);   // aparece y se consume
    if (a <= 0) continue;
    const ex = m.x - m.dx * m.largo, ey = m.y - m.dy * m.largo;
    const g = cx.createLinearGradient(m.x, m.y, ex, ey);
    g.addColorStop(0,    `rgba(255,240,200,${a})`);
    g.addColorStop(0.25, `rgba(255,140,30,${a * 0.8})`);
    g.addColorStop(1,    'rgba(160,0,0,0)');
    cx.strokeStyle = g; cx.lineWidth = m.grosor; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(m.x, m.y); cx.lineTo(ex, ey); cx.stroke();

    const R = m.grosor * 3.6;
    const rg = cx.createRadialGradient(m.x, m.y, 0, m.x, m.y, R);
    rg.addColorStop(0,   `rgba(255,255,230,${a})`);
    rg.addColorStop(0.4, `rgba(255,150,40,${a * 0.6})`);
    rg.addColorStop(1,   'rgba(255,60,0,0)');
    cx.fillStyle = rg;
    cx.beginPath(); cx.arc(m.x, m.y, R, 0, 6.2832); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';
  // cabeza rocosa de los meteoritos grandes
  for (const m of meteoros) {
    if (!m.grande) continue;
    const p = m.edad / m.dur;
    const a = Math.min(1, p / 0.12) * Math.min(1, (1 - p) / 0.3);
    if (a <= 0) continue;
    cx.fillStyle = `rgba(45,20,12,${a})`;
    cx.beginPath(); cx.arc(m.x, m.y, m.grosor * 0.75, 0, 6.2832); cx.fill();
    cx.strokeStyle = `rgba(255,120,30,${a})`; cx.lineWidth = 2;
    cx.stroke();
  }
}

function actualizarDibujarBrasas(dt) {
  cx.globalCompositeOperation = 'lighter';
  for (let i = brasas.length - 1; i >= 0; i--) {
    const b = brasas[i];
    b.edad += dt;
    if (b.edad >= b.vida) { brasas.splice(i, 1); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 60 * dt;
    const a = 1 - b.edad / b.vida;
    cx.fillStyle = `rgba(255,${Math.round(90 + 130 * a)},30,${a})`;
    cx.beginPath(); cx.arc(b.x, b.y, b.r, 0, 6.2832); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';
}

/* ── ACTIVAR LLUVIAS ── */
let lluviaHasta = 0, acumulador = 0, proxMeteoro = performance.now() + 1500;

function lluviaMeteoritos(ms) {              // también sirve desde la consola: lluviaMeteoritos(8000)
  lluviaHasta = performance.now() + (ms || CONFIG.lluviaFuerte.duracionMs);
}
setTimeout(function repetir() {
  lluviaMeteoritos();
  setTimeout(repetir, CONFIG.lluviaFuerte.cadaMs);
}, CONFIG.lluviaFuerte.primeraEnMs);

/* ── DRAGÓN VOLADOR ── */
const elDragon = document.getElementById('dragon');
const D = { activo: false, t: 0, dir: 1, yBase: 200, respiraAcum: 0 };
const DW = CONFIG.dragon.tamano, DH = DW * 296 / 440;
const BOCA = { fx: 0.9545, fy: 0.3243 };      // posición de la boca dentro del dibujo

function volarDragon() {                      // también sirve desde la consola: volarDragon()
  if (D.activo) return;
  D.activo = true; D.t = 0;
  D.dir = Math.random() < 0.5 ? 1 : -1;
  D.yBase = rand(160, 300);
  elDragon.style.display = 'block';
}
setTimeout(function repetir() {
  volarDragon();
  setTimeout(repetir, CONFIG.dragon.cadaMs);
}, CONFIG.dragon.primeroEnMs);

function actualizarDragon(dt) {
  if (!D.activo) return;
  D.t += dt;
  const dur = CONFIG.dragon.duracionMs / 1000;
  const p = D.t / dur;
  if (p >= 1) { D.activo = false; elDragon.style.display = 'none'; return; }

  const recorrido = 1920 + DW + 120;
  const velX = recorrido / dur;
  const avance = -DW - 60 + recorrido * p;
  const x = D.dir === 1 ? avance : 1920 - DW - avance;         // x = borde izquierdo del dibujo
  const y = D.yBase + Math.sin(D.t * 2.2) * 38;
  const vy = Math.cos(D.t * 2.2) * 38 * 2.2;
  const ang = Math.atan2(vy, velX) * 0.55;                       // cabeceo según la subida/bajada

  elDragon.style.transform =
    `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scaleX(${D.dir}) rotate(${(ang * 57.2958).toFixed(2)}deg)`;

  // aliento de fuego: 1.2 s cada 3.4 s (después de 1.5 s de vuelo)
  const ciclo = (D.t - 1.5) % 3.4;
  const respira = D.t > 1.5 && ciclo > 2.2;
  if (respira) {
    const cxD = x + DW / 2, cyD = y + DH / 2;
    const lx = (BOCA.fx - 0.5) * DW, ly = (BOCA.fy - 0.5) * DH;
    const rx = lx * Math.cos(ang) - ly * Math.sin(ang);
    const ry = lx * Math.sin(ang) + ly * Math.cos(ang);
    const bx = cxD + D.dir * rx, by = cyD + ry;
    D.respiraAcum += dt * 150;
    while (D.respiraAcum >= 1) {
      D.respiraAcum--;
      llamas.push({
        x: bx, y: by,
        vx: D.dir * Math.cos(ang) * rand(330, 520) + D.dir * velX * 0.6,
        vy: Math.sin(ang) * 300 + rand(-70, 45),
        vida: rand(0.55, 0.95), edad: 0, r0: rand(5, 10)
      });
    }
  }
}

function actualizarDibujarLlamas(dt) {
  cx.globalCompositeOperation = 'lighter';
  for (let i = llamas.length - 1; i >= 0; i--) {
    const f = llamas[i];
    f.edad += dt;
    if (f.edad >= f.vida) { llamas.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.vy -= 40 * dt;     // el fuego sube un poco
    const p = f.edad / f.vida;
    const r = f.r0 + p * 30;
    const a = (1 - p) * 0.75;
    const g = cx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0,   `rgba(255,${Math.round(230 - 120 * p)},110,${a})`);
    g.addColorStop(0.5, `rgba(255,${Math.round(120 - 70 * p)},20,${a * 0.6})`);
    g.addColorStop(1,   'rgba(120,0,0,0)');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(f.x, f.y, r, 0, 6.2832); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';
}

/* ── BUCLE PRINCIPAL ── */
let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000);
  ultimo = ahora;

  // lluvia ligera constante
  if (ahora >= proxMeteoro) {
    crearMeteoro(Math.random() < 0.12);
    proxMeteoro = ahora + rand(CONFIG.meteoroCadaMs[0], CONFIG.meteoroCadaMs[1]);
  }
  // lluvia fuerte
  if (ahora < lluviaHasta) {
    acumulador += dt * CONFIG.lluviaFuerte.porSegundo;
    while (acumulador >= 1) { acumulador--; crearMeteoro(Math.random() < 0.15); }
  }

  actualizarMeteoros(dt);
  actualizarDragon(dt);

  cx.clearRect(0, 0, 1920, 1080);
  dibujarMeteoros();
  actualizarDibujarBrasas(dt);
  actualizarDibujarLlamas(dt);

  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);

/* ═══════════════════════════════════════════════
   🖥️ Fuera de OBS: escalar a la ventana
   ═══════════════════════════════════════════════ */
if (document.documentElement.className === 'fuera') {
  const st = document.getElementById('stage');
  const ajustar = () => {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    st.style.transformOrigin = '0 0';
    st.style.transform = `scale(${s})`;
  };
  ajustar();
  window.addEventListener('resize', ajustar);
}
